# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

parameters:

  - name: environment
    displayName: Test Environment
    type : string
    default : qa
    values :
    - qa
    - dev
    - uat
    - prod

  - name: suiteName
    displayName : Test Suite
    type: string
    default: sanity
    values :
    - sanity
    - regression
    - demo
    - feature 2
  
  - name: browser
    displayName: Test Browser
    type: string
    default : chrome
    values:
    - chrome
    - firefox
    - safari

pool:
  vmImage: 'ubuntu-latest'

resources:
- repo: self

variables:
  TEST_BROWSER       :  ${parameters.browser}
  SUITE_NAME         :  ${parameters.suiteName}
  TEST_ENVIRONMENT   :  ${parameters.environment}
  autotest-image-name: 'autotest-design-systems'


steps:
- script: |
      docker build -f Dockerfile -t $(autotest-image-name) .
      docker run --name autotest -v "$(System.DefaultWorkingDirectory)/junit-results:/app/Reports/testReports" \
      $(autotest-image-name) /bin/bash -c "npm run testondocker" 
     
  displayName: 'build docker image and run tests'

- script: |
      mkdir junit-results
      docker ps -a
      CONTAINER_ID=$(docker ps -alq)
      echo $CONTAINER_ID
      docker container cp $CONTAINER_ID:/app/Reports/testReports junit-results
      cd junit-results
      ls -altr

  displayName : "copy files from container to local directory"

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'TEST-*.xml'
    searchFolder:  '$(System.DefaultWorkingDirectory)/junit-results'
    mergeTestResults: true
    failTaskOnFailedTests: true
    publishRunAttachments: true
    testRunTitle : 'Home Connect Tests'