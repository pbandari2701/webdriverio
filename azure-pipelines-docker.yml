# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

parameters:

  - name: Env
    displayName: Test Environment
    type : string
    default : qa
    values :
    - qa
    - dev
    - uat
    - prod

  - name: suiteName
    displayName : Test Suite
    default: sanity
    values :
    - sanity
    - regression
    - demo
    - feature 2

pool:
  vmImage: 'ubuntu-latest'

resources:
- repo: self

variables:
  autotest-image-name: 'autotest-design-systems'

steps:
- script: |
      docker build -f Dockerfile -t $(autotest-image-name) .
      docker run $(autotest-image-name) 
      npx wdio run wdio.docker.conf.js --cucumberOpts.tagExpression=@${{ parameters.suiteName }}
      ls -altr
  displayName: 'build docker image and run tests'

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'TEST-*.xml'
    searchFolder:  ' $(System.DefaultWorkingDirectory)/Reports/testReports/'
    mergeTestResults: true
    failTaskOnFailedTests: true
    publishRunAttachments: true
    testRunTitle : 'Home Connect Tests'