# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

parameters:

  - name: environment
    displayName: Test Environment
    type : string
    default : qa
    values :
    - qa
    - dev
    - uat
    - prod

  - name: suiteName
    displayName : Test Suite
    type: string
    default: tier1
    values :
    - tier1
    - tier2
    - clickthrough
    - regression
    - wip
  
  - name: browser
    displayName: Test Browser
    type: string
    default : chrome
    values:
    - chrome
    - firefox
    - safari

pool:
  vmImage: 'ubuntu-latest'

resources:
- repo: self

variables:
  TEST_BROWSER       :  ${parameters.browser}
  SUITE_NAME         :  ${parameters.suiteName}
  TEST_ENVIRONMENT   :  ${parameters.environment}
  autotest-image-name: 'autotest-design-systems'


steps:

- script: |
      docker build -f Dockerfile -t $(autotest-image-name) .
      docker run --name autotest $(autotest-image-name) npm run testondocker -- --cucumberOpts.tagExpression=@${{ parameters.suiteName }}
  displayName: 'build docker image and run tests'

- script: |
      docker cp autotest:app/junit ${PWD}/Reports/testReports/
  displayName: 'copy Junit Reports'    

- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'TEST-*.xml'
    searchFolder:  '$(System.DefaultWorkingDirectory)/Reports/testReports/junit'
    mergeTestResults: true
    failTaskOnFailedTests: true
    publishRunAttachments: true
    testRunTitle : 'HDS Tests'